[package]
name = "hazina-seller-bond"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0", features = ["alloc"] }
proptest     = { version = "1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils", "alloc"] }

[features]
fuzz-tests = ["dep:proptest"]

# Property-based invariant suite (docs/INVARIANTS.md). `required-features`
# keeps it out of the default `cargo test` gate entirely rather than relying
# on a `#![cfg]` that still has to compile.
[[test]]
name = "fuzz"
path = "tests/fuzz/main.rs"
required-features = ["fuzz-tests"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
