name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Format ────────────────────────────────────────────────────────────────────
  format:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --legacy-peer-deps

      - name: Check formatting
        run: npm run format:check

  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --prefix backend

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --prefix frontend

      - name: Lint backend
        run: npm run lint --prefix backend

      - name: Lint frontend
        run: npm run lint --prefix frontend

  # ── Type-check ────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --prefix backend

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --prefix frontend

      - name: Type-check backend
        run: npm run typecheck --prefix backend

      - name: Type-check frontend
        run: npm run typecheck --prefix frontend

  # ── Frontend tests ────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test

  # ── Frontend build ────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

  # ── Smart contract ────────────────────────────────────────────────────────────
  contract:
    name: Smart Contract (Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/hazina-escrow
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Build contract
        run: cargo build --release

      - name: Run contract tests
        run: cargo test

  # ── Contract artifacts (WASM + spec JSON) ─────────────────────────────────────
  contract-artifacts:
    name: Contract Artifacts (WASM + Spec)
    runs-on: ubuntu-latest
    needs: contract
    defaults:
      run:
        working-directory: contracts/hazina-escrow
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Build release WASM
        run: cargo build --release --target wasm32v1-none

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Extract contract spec to JSON
        run: >
          stellar contract inspect
          --wasm target/wasm32v1-none/release/hazina_escrow.wasm
          --output json > spec.json

      - name: Upload contract artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: soroban-contract-artifacts
          path: |
            contracts/hazina-escrow/target/wasm32v1-none/release/hazina_escrow.wasm
            contracts/hazina-escrow/spec.json
          retention-days: 90
