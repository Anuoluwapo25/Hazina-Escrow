name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Format ────────────────────────────────────────────────────────────────────
  format:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --legacy-peer-deps

      - name: Check formatting
        run: npm run format:check

  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --prefix backend

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --prefix frontend

      - name: Lint backend
        run: npm run lint --prefix backend

      - name: Lint frontend
        run: npm run lint --prefix frontend

  # ── Type-check ────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --prefix backend

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --prefix frontend

      - name: Type-check backend
        run: npm run typecheck --prefix backend

      - name: Type-check frontend
        run: npm run typecheck --prefix frontend

  # ── Frontend tests ────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test

  # ── Frontend build ────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

  # ── Smart contract ────────────────────────────────────────────────────────────
  contract:
    name: Smart Contract (Build + Test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract: [hazina-escrow, hazina-access-pass]
    defaults:
      run:
        working-directory: contracts/${{ matrix.contract }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Build contract
        run: cargo build --release

      - name: Run contract tests
        run: cargo test

  # ── Contract artifacts (WASM + spec JSON) ─────────────────────────────────────
  contract-artifacts:
    name: Contract Artifacts (WASM + Spec)
    runs-on: ubuntu-latest
    needs: contract
    # Without this the job inherits GitHub's 6-hour default, so a wedged step
    # burns most of a day of runner time before anyone sees a red check.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        contract: [hazina-escrow, hazina-access-pass]
    defaults:
      run:
        working-directory: contracts/${{ matrix.contract }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Resolve artifact names
        run: echo "WASM_NAME=$(echo "${{ matrix.contract }}" | tr '-' '_')" >> "$GITHUB_ENV"

      - name: Build release WASM
        run: cargo build --release --target wasm32v1-none

      # `cargo install --locked stellar-cli` rebuilt the whole CLI from source on
      # every run (~20 min, and rust-cache does not cover ~/.cargo/bin), which is
      # also the only reason this job needed libdbus/libudev headers from apt.
      # That apt step is what hung: when the runner's Ubuntu mirror went
      # unreachable, `apt-get update` retried for hours. The published binary
      # needs neither, and links only against libdbus-1.so.3 / libudev.so.1,
      # which the ubuntu-latest image already ships.
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: 27.1.0
        run: |
          curl -sSL --retry 3 --retry-delay 5 --retry-all-errors \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Extract contract spec to JSON
        run: >
          stellar contract info interface
          --wasm target/wasm32v1-none/release/${{ env.WASM_NAME }}.wasm
          --output json > spec.json

      - name: Upload contract artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: soroban-contract-artifacts-${{ matrix.contract }}
          path: |
            contracts/${{ matrix.contract }}/target/wasm32v1-none/release/${{ env.WASM_NAME }}.wasm
            contracts/${{ matrix.contract }}/spec.json
          retention-days: 90
