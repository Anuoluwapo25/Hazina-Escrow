services:
  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./data:/app/data

  # Escrow contract watcher — deliberately its own container, not a replica
  # of `backend`, so a compromised or crashed API host can't silently take
  # the watcher down with it. See docs/MONITORING.md. Set SENTINEL_ENABLED=true
  # and ESCROW_CONTRACT_ID in backend/.env to arm it.
  sentinel:
    build:
      context: ./backend
      target: sentinel-dev
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"   